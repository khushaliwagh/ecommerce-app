services:
  - type: web
    name: shop-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL          # e.g. jdbc:mysql://HOST:PORT/DBNAME?sslMode=REQUIRED
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ORIGINS    # your deployed frontend URL, no trailing slash
        sync: false
      - key: ADMIN_KEY       # secret for the /admin dashboard; Render generates a strong one
        generateValue: true
      - key: SIMULATION_ENABLED
        value: "true"
