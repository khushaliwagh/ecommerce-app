spring.application.name=shop-api
server.port=${PORT:8081}

# --- MySQL (override with env vars in production) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- App settings ---
# Comma separated list of allowed frontend origins (Vercel / Netlify URL in production)
shop.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
# Secret for /api/admin/** (sent as the X-Admin-Key header). CHANGE THIS in production!
# Leave empty to disable the admin API entirely.
shop.admin.key=${ADMIN_KEY:admin123}
# Demo traffic simulator: random purchases/restocks so the live UI is visible with no users
shop.simulation.enabled=${SIMULATION_ENABLED:true}
shop.simulation.interval-ms=${SIMULATION_INTERVAL_MS:9000}

# SSE streams should never time out
spring.mvc.async.request-timeout=-1
